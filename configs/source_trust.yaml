# Registry do hệ thống quản lý. Giá trị trust trong tài liệu đầu vào không
# được dùng để ra quyết định; nguồn không có trong registry nhận trust mặc định.
version: 1
default_trust_level: 0.0
sources:
  baseline_seed_internal:
    trust_level: 0.70
    allowed: true
  OWASP:
    trust_level: 0.95
    allowed: true
  arXiv:
    trust_level: 0.85
    allowed: true
  Medium:
    trust_level: 0.40
    allowed: true
  poison_experiment:
    trust_level: 0.20
    allowed: false
