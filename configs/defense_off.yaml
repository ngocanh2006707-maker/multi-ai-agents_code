# Unprotected OFF baseline: public workflow bypasses all PI/CF/tool defenses.
# No input/output schema, context isolation, allowlist, path/resource caps or approval.
security:
  defense_enabled: false
  input_guard: false
  retrieval_guard: false
  output_guard: false
  min_trust_level: 0.0
  verify_content_hash: false
  require_managed_trust: false
  require_allowlisted_source: false
  trust_aware_ranking: false
  harden_untrusted_context: false
  enforce_confidence_gate: false
  prompt_risk_weights:
    override: 0.65
    internal_target: 0.70
    sensitive_action: 0.70
    roleplay: 0.15
    authority_claim: 0.55
    obfuscation: 0.20
    tool_intent: 0.45
  prompt_risk_medium_threshold: 0.55
  prompt_risk_high_threshold: 0.80
  retrieval_risk_medium_threshold: 0.55
  retrieval_risk_high_threshold: 0.80
  semantic_classifier_enabled: false
  semantic_classifier_timeout_seconds: 0.5
  semantic_positive_policy: high
  semantic_fallback_policy: medium
  prompt_structure_check_enabled: false
  action_gate_enabled: false
  action_gate_require_provenance: false
